# Opt-in TEC5 exploratory policy. Requires rule-range support.
# Application-facing file read/write attempts, including cache hits.
# Target QD 2 is based on the ThinkPad TEC measurements, not a general optimum.
# Keep qd-policy.conf unchanged for existing exact-rule users and old binaries.
window_ms 1000
stable_ms 10000
min_requests 16
min_pairs 16
dominance_percent 80
sequential_percent 80
random_percent 20
ratio_tolerance 5
thresholds 32768 131072 1048576

# Inclusive ranges; read ranges do not use ratio_tolerance.
# rule-range CONTEXT NAME REQUESTERS FILES BYTES seq|rand|any READ_PERCENT QD
rule-range thinkpad-tec-c2 small-read 1:2 2:32 1024:8192 any 95:100 2
rule-range thinkpad-tec-c6 small-read 1:2 2:32 1024:8192 any 95:100 2
