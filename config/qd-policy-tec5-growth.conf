# Opt-in transfer experiment: historical throughput-oriented QD growth targets.
# The earlier DELL C2 sequential-write result selected 32; ThinkPad C2 random
# write / write-heavy results selected 512. Those results do not establish a
# throughput benefit for TEC5. Both targets are tested on the current C2 host.
# Trigger on actual TEC5 app-facing FUSE iter attempts, including cache hits.
# Do not relabel TEC5's mostly-read file I/O as the earlier write workloads.
# Existing qd-policy.conf and qd-policy-tec.conf remain unchanged.
window_ms 1000
stable_ms 10000
min_requests 16
min_pairs 16
dominance_percent 80
sequential_percent 80
random_percent 20
ratio_tolerance 5
thresholds 32768 131072 1048576

# Inclusive ranges; read ranges use raw counts without ratio_tolerance.
# rule-range CONTEXT NAME REQUESTERS FILES BYTES seq|rand|any READ_PERCENT QD
rule-range tec5-c2-grow32 small-read-grow 1:2 2:32 1024:8192 any 95:100 32
rule-range tec5-c2-grow512 small-read-grow 1:2 2:32 1024:8192 any 95:100 512
