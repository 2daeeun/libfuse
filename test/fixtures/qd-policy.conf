# Fixed regression fixture for policy, option, and CLI tests.
# Edit config/qd-policy.conf for experiments; changing that user configuration
# must not alter the seven reference cases checked by these regression tests.
window_ms 1000
stable_ms 10000
min_requests 16
min_pairs 16
dominance_percent 80
sequential_percent 80
random_percent 20
ratio_tolerance 5
thresholds 32768 131072 1048576

# rule CONTEXT NAME REQUESTERS FILES SIZE seq|rand READ_PERCENT TARGET_QD
rule dell-c2 sw-128k-32t-32f 32 32 131072 seq 0 32
rule dell-c2 sr-128k-32t-32f 32 32 131072 seq 100 2
rule thinkpad-c2 rw-4k-1t-1f 1 1 4096 rand 0 512
rule thinkpad-c2 randrw50-4k-1t-1f 1 1 4096 rand 50 2
rule thinkpad-c2 randrw25-4k-32t-32f 32 32 4096 rand 25 512
rule dell-c6 rr-1m-32t-1f 32 1 1048576 rand 100 32
rule thinkpad-c6 seqrw50-1m-1t-1f 1 1 1048576 seq 50 2
